<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- A hanging festival lantern with a small flame inside — almanac at the base. -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e9c46a"/>
      <stop offset="0.6" stop-color="#c89c3a"/>
      <stop offset="1"   stop-color="#7a3f5a"/>
    </linearGradient>
  </defs>
  <!-- top hanger -->
  <line x1="32" y1="6"  x2="32" y2="12" stroke="#c89c3a" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="42" y2="14" stroke="#c89c3a" stroke-width="2" stroke-linecap="round"/>
  <!-- lantern body -->
  <path d="M22 16 L42 16 L46 22 L46 42 L42 48 L22 48 L18 42 L18 22 Z"
        stroke="#7a3f5a" stroke-width="2.4" fill="url(#glow)" opacity="0.92"/>
  <!-- inner vertical bars (slats) -->
  <line x1="27" y1="22" x2="27" y2="42" stroke="#7a3f5a" stroke-width="1.4" opacity="0.55"/>
  <line x1="37" y1="22" x2="37" y2="42" stroke="#7a3f5a" stroke-width="1.4" opacity="0.55"/>
  <!-- flame -->
  <path d="M32 26 C29 30 28 33 30 36 C31.5 38 32.5 38 34 36 C36 33 35 30 32 26 Z"
        fill="#fff" opacity="0.95"/>
  <!-- almanac (small book) at the base -->
  <rect x="20" y="50" width="24" height="6" rx="1.2" stroke="#7a3f5a" stroke-width="1.8" fill="#faf4e6"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#7a3f5a" stroke-width="1" opacity="0.6"/>
</svg>
